name: docker

# Build and start the image; publish it to ghcr.io only for a version tag or a manual run.
on:
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, .github/workflows/docker.yml, pyproject.toml, uv.lock]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/capedcrusader77/motionproof
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t "$IMAGE:latest" .
      - name: Start it and wait for the demo experiment
        run: |
          docker run -d --name mp -p 127.0.0.1:8000:8000 -e MOTIONPROOF_LOCAL=1 "$IMAGE:latest"
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8000/api/v1/experiments | grep -q '"status":"completed"'; then
              curl -sf http://127.0.0.1:8000/ | grep -q '<div id="root">'
              echo "demo experiment completed"; exit 0
            fi
            sleep 4
          done
          docker logs mp
          exit 1
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:latest"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            docker tag "$IMAGE:latest" "$IMAGE:${GITHUB_REF_NAME#v}"
            docker push "$IMAGE:${GITHUB_REF_NAME#v}"
          fi
