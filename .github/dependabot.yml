version: 2
# One grouped pull request per ecosystem per month, instead of one per package. Security
# updates still arrive on their own, as soon as they are published.
updates:
  - package-ecosystem: uv      # also updates uv.lock; CI installs with `uv sync --locked`
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # every benchmark and validation result was produced on MuJoCo 3.x; move to 4.x on purpose
      - dependency-name: mujoco
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      # types should match the Node version the project runs on, not the newest release
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
