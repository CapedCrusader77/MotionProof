[project]
name = "motionproof"
version = "0.3.0"
license = "MIT"
description = "Tolerance-to-dynamics verification for mechanical assemblies"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "cadquery>=2.8.0",
    "fastapi>=0.162.7",
    "glfw>=2.11.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "mujoco==3.14.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyopengl>=3.1.10",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "sqlalchemy>=2.1.8",
    "trimesh>=5.2.1",
    "typer>=0.29.1",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
hardware = ["pyserial>=3.5"]
external = ["pyarrow>=21"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scripts", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["N812", "N806", "N814", "N818", "B008"]

[tool.ruff.lint.per-file-ignores]
"motionproof/reference/nema17_arm.py" = ["E501"]
"motionproof/cad/geometry.py" = ["E501"]
"motionproof/tolerances/capability.py" = ["E501"]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["scripts/", "frontend/"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]
addopts = "-q"

[project.scripts]
motionproof = "motionproof.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["motionproof"]
